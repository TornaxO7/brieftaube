[package]
name = "brieftaube"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6", default-features = false, features = [
  "wayland-data-control",
] }
chrono = "0.4"
chumsky = "0.13"
color-eyre = "0.6"
crossterm = { version = "0.29", default-features = false, features = [
  "bracketed-paste",
  "derive-more",
  "events",
  "event-stream",
] }
futures = "0.3"
jmap-client = { git = "https://github.com/TornaxO7/jmap-client", branch = "my" }
mail-parser = "0.11"
material-theme-loader = "0.1"
nucleo = "0.5"
htmd = "0.5"
pulldown-cmark-mdcat = { version = "2.13", default-features = false, features = [
  "ratatui",
] }
# ormlite = { version = "0.24", features = ["sqlite"] }
ratatui = "0.30"
ratatui-textarea = "0.9.2"
thiserror = "2"
throbber-widgets-tui = { git = "https://github.com/TornaxO7/throbber-widgets-tui", branch = "block" }
tui-logger = { version = "0.18", features = ["tracing-support"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.1"
tokio = { version = "1.52", features = [
  "rt-multi-thread",
  "tokio-macros",
  "macros",
  "sync",
] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xdg = "3.0"

[dev-dependencies]
rand = "0.10"
